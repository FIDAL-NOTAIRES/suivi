<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>SUIVI — dossiers</title>
<script src="https://connexion-omega.vercel.app/bandeau.js" defer></script>
<script src="/calendrier.js"></script>
<script src="/types.js"></script>
<script src="/lecture.js"></script>
<style>
/* ------------------------------------------------------------------
   SUIVI — suivi des dossiers. Grammaire visuelle reprise de PHARE :
   anneau segmenté, modules hexagonaux branchés par des barres à
   segments, cœur holographique, panneau déporté.
   Charte FIDAL v2.2 : Georgia (titres) / Segoe UI (texte)
------------------------------------------------------------------ */
:root{
  --fond:#081625; --canard:#33838B; --orange:#FF982D; --carmin:#A01040; --rouge:#E0456E;
  --cyan:#6DD5DC; --jaune:#FFC900; --texte:#E8EFF5; --gris:#92A6B8;
  --bord:#27425B; --ardoise:#122A42; --signet:#33838B;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--fond);color:var(--texte);
  font:15px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;overflow:hidden}
body::before{content:"";position:fixed;inset:-20% -10% auto;height:70vh;pointer-events:none;
  background:radial-gradient(60% 70% at 50% 0%,rgba(51,131,139,.22),transparent 70%)}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;font-weight:400;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--jaune);outline-offset:2px}
.cache{display:none!important}
.mono{font:600 10.5px/1.4 ui-monospace,'Cascadia Mono','Segoe UI Mono',Menlo,monospace;letter-spacing:.16em;text-transform:uppercase}

.enveloppe{max-width:1280px;margin:0 auto;padding:0 26px;width:100%;position:relative}
#appli{flex:1;min-height:0;display:flex;flex-direction:column}

/* ---------- en-tête ---------- */
.barre{display:flex;align-items:center;gap:22px;padding:12px 0 6px;flex:none}
.marque{display:flex;align-items:center;gap:13px}
.trait{width:3px;height:38px;background:var(--jaune);border-radius:2px}
.marque b{display:block;font-family:Georgia,serif;font-size:19px;letter-spacing:.14em;font-weight:400;line-height:1.1}
.marque span{display:block;color:var(--cyan)}
.champ{position:relative;width:min(320px,100%);margin-left:auto}
.champ input{width:100%;padding:9px 12px 9px 36px;background:rgba(255,255,255,.05);border:1px solid var(--bord);border-radius:3px;outline:none;color:var(--texte)}
.champ input:focus{border-color:var(--jaune)}
.champ input::placeholder{color:#7D93A7}
.champ svg{position:absolute;left:12px;top:10px;width:16px;height:16px;stroke:#7D93A7;fill:none;stroke-width:2}
.bouton{border:1px solid var(--bord);background:transparent;color:var(--texte);border-radius:3px;padding:8px 14px;white-space:nowrap}
.bouton:hover{background:rgba(255,255,255,.06)}
.bouton.fort{background:var(--jaune);border-color:var(--jaune);color:#1B2A3A;font-weight:600}
.bouton.fort:hover{filter:brightness(1.07)}
.bouton.danger{color:#FF8FAE;border-color:#6A2340}
.bouton.petit{padding:4px 10px;font-size:13px}
.bouton:disabled{opacity:.45;cursor:default}

/* bandeau des fériés et solennités, à la couleur liturgique */
.fete{flex:none;margin:4px 0 0;padding:8px 14px;font-family:Georgia,serif;font-size:15px;border-left:3px solid}
.fete.blanc{background:rgba(251,248,239,.95);color:#1B2A3A;border-left-color:#C9A646;box-shadow:inset 0 -1px 0 #C9A646}
.fete.rouge{background:rgba(160,16,64,.85);border-left-color:#FF8FAE}
.fete.vert{background:rgba(47,107,63,.85);border-left-color:#8FD3A1}
.fete.violet{background:rgba(91,42,110,.85);border-left-color:#CDA2E0}

/* ---------- l'anneau et le panneau ---------- */
.ciel{flex:1;min-height:0;display:flex;gap:18px;align-items:stretch;padding:4px 0}
svg.carte{flex:1 1 auto;min-width:0;height:100%;display:block}
.ico{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.module{cursor:pointer}
.module:focus{outline:none}
.segment{transition:opacity .18s}
@keyframes allumage{from{opacity:0}to{opacity:var(--opf,.9)}}
.segment.allumage{animation:allumage .42s ease-out both}
.module:hover .segment,.module:focus .segment,.module.choisi .segment{opacity:1}
.ecusson{transition:stroke-width .18s}
.module:hover .ecusson,.module:focus .ecusson,.module.choisi .ecusson{stroke-width:2.4}
.cadre-survol{opacity:0;transition:opacity .15s}
.module:hover .cadre-survol,.module:focus .cadre-survol,.module.choisi .cadre-survol{opacity:.9}
.etiquette{font:600 10.5px/1 ui-monospace,'Cascadia Mono','Segoe UI Mono',Menlo,monospace;letter-spacing:.1em;pointer-events:none;opacity:.8}
.module:hover .etiquette,.module:focus .etiquette,.module.choisi .etiquette{opacity:1}
.cran{stroke:#0A1C2C;stroke-width:3}
.titre-arc{font:600 10px/1 ui-monospace,Menlo,monospace;letter-spacing:.2em}
.eteint{opacity:.13}
.vide-arc{font:12px "Segoe UI",sans-serif;fill:#5E7A8D}
.borne{font:600 8.5px/1 ui-monospace,'Cascadia Mono',Menlo,monospace;letter-spacing:.08em;opacity:.8;pointer-events:none}
.titre-mat{font:400 12px/1 Georgia,serif;letter-spacing:.3em}
.titre-arc{font-size:9px}
.barre-nom{font-family:ui-monospace,'Cascadia Mono','Segoe UI Mono',Menlo,monospace;font-weight:600;letter-spacing:.05em;paint-order:stroke;stroke:#0A1C2C;stroke-width:2.6px;stroke-linejoin:round;pointer-events:none}
.rouge-fort{color:#FF8FAE;font-weight:600}
.legende span{white-space:nowrap}
@keyframes influx{from{stroke-dashoffset:var(--long,200)}to{stroke-dashoffset:0}}
.influx{fill:none;stroke-width:2.5;stroke-linecap:round;stroke-dasharray:var(--eclat,18) var(--long,200);animation:influx var(--vitesse,6s) linear infinite;animation-delay:var(--decalage,0s)}
@keyframes tourne{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@keyframes tourne-inv{from{transform:rotate(0)}to{transform:rotate(-360deg)}}
@keyframes bat{0%,100%{opacity:.6;transform:scale(1)}50%{opacity:1;transform:scale(1.12)}}
@keyframes respire{0%,100%{opacity:.18}50%{opacity:.46}}
@keyframes alerte{0%,100%{opacity:.35}50%{opacity:1}}
.gire{animation:tourne var(--tour,30s) linear infinite}
.gire-inv{animation:tourne-inv var(--tour,30s) linear infinite}
.reacteur{animation:bat 3.2s ease-in-out infinite}
.halo-coeur{animation:respire 6s ease-in-out infinite}
.pulse{animation:alerte 1.8s ease-in-out infinite}
.sablier{cursor:pointer}
.sablier .zone-sab{fill:transparent}
.sablier:hover use{filter:brightness(1.3)}
@keyframes clignote{0%,100%{opacity:1}50%{opacity:.15}}
.sablier.clignote use{animation:clignote 1s steps(2,end) infinite}
.etude{border:1px solid var(--bord);border-radius:6px;padding:8px 10px;margin-top:4px}
.etude-ligne{display:flex;align-items:center;gap:10px;padding:5px 0;border-top:1px solid rgba(255,255,255,.06);font-size:13.5px}
.etude-ligne:first-child{border-top:0}
.etude-ligne .qui{flex:1;min-width:0}
.etude-ligne .qui b{font-weight:600;color:#EDF6FA}
.etude-ligne .qui span{display:block;color:var(--gris);font-size:12px;overflow:hidden;text-overflow:ellipsis}
.etude-ligne label.case{margin:0;white-space:nowrap}
.etude-ligne .sans{color:var(--gris);font-size:12px;white-space:nowrap}
.etude-ligne .retirer{border:0;background:none;color:var(--gris);font-size:18px;line-height:1;padding:0 4px}
.etude-ajout{display:flex;gap:8px;align-items:center;margin-top:8px}
.etude-ajout select{flex:1}
.etude-vide{color:var(--gris);font-size:13px;padding:4px 0}
.motif-requis{border:2px solid var(--orange)!important;box-shadow:0 0 0 3px rgba(255,152,45,.18)}
.coeur-clic{cursor:pointer}
.compte{font:400 46px/1 ui-monospace,'Cascadia Mono','Segoe UI Mono',Menlo,monospace;fill:#CDEFF4}
.compte.chaud{fill:#FFB667}
.indic{font:600 9.5px/1 "Segoe UI",sans-serif;letter-spacing:.22em;fill:#6E93A8}
.indic-fort{font:600 10px/1 ui-monospace,Menlo,monospace;letter-spacing:.2em;fill:#9FC4D2}

.panneau{flex:none;width:300px;align-self:center;max-height:100%;overflow-y:auto;padding:16px 16px 16px 15px;
  border-left:2px solid #2A5872;background:linear-gradient(90deg,rgba(18,42,66,.75),rgba(10,28,44,.2));
  clip-path:polygon(0 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%)}
.panneau h3{font-size:19px;line-height:1.25;margin:0 0 6px;color:#EDF6FA}
.panneau .haut{margin:0 0 8px}
.panneau p{margin:0 0 8px;font-size:13px;color:#9FB8C8}
.panneau .alerte{color:#FFB667}
.panneau .rouge{color:#FF8FAE}
.panneau .actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.panneau ul{list-style:none;margin:0;padding:0}
.panneau li{padding:8px 0;border-top:1px solid rgba(255,255,255,.07);font-size:13px}
.panneau li:first-child{border-top:0}
.panneau li b{display:block;color:#EDF6FA;font-weight:600;cursor:pointer}
.panneau li span{color:#9FB8C8}
.panneau .petits{display:flex;gap:6px;margin-top:5px;flex-wrap:wrap}
.panneau .rapide{margin-top:12px;border-top:1px solid rgba(255,255,255,.08);padding-top:10px}
.panneau input[type=text]{width:100%;padding:7px 10px;background:rgba(255,255,255,.06);border:1px solid var(--bord);border-radius:3px;outline:none}
.panneau input[type=text]:focus{border-color:var(--jaune)}

/* pied */
footer{flex:none;border-top:1px solid #1B3049;padding:8px 0 10px;color:#7D93A7;font-size:12.5px}
footer .enveloppe{display:flex;gap:18px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.lien{background:none;border:0;color:var(--cyan);padding:0;text-decoration:underline;font-size:12.5px}
.legende{display:flex;gap:16px;flex-wrap:wrap}
.legende i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:0}

/* ---------- repli en liste (écrans étroits) ---------- */
.repli{display:none;padding:6px 0 30px}
.repli h2{margin:18px 0 4px;display:flex;align-items:center;gap:9px}
.repli h2 i{width:20px;height:3px;border-radius:2px;display:block}
.repli a{display:block;text-decoration:none;color:inherit;padding:9px 0 9px 14px;border-left:3px solid #1E3650;cursor:pointer}
.repli a b{display:block;font-weight:600}
.repli a span{display:block;font-size:13px;color:var(--gris)}

/* ---------- volet du dossier ---------- */
.voile{position:fixed;inset:0;background:rgba(4,10,18,.66);z-index:20}
.volet{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:#0C1F33;border-left:1px solid var(--bord);z-index:21;overflow-y:auto;padding:22px 26px 40px}
.volet h2{font-size:24px;padding-right:40px;line-height:1.25}
.volet .fermer{position:absolute;top:14px;right:18px;border:0;background:none;font-size:26px;color:var(--gris)}
.volet .sous{color:var(--gris);font-size:13.5px;margin:4px 0 12px}
.etapes{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 14px}
.etapes button{border:1px solid var(--bord);background:transparent;color:var(--texte);border-radius:16px;padding:4px 12px;font-size:13.5px}
.etapes button.actuelle{background:var(--canard);border-color:var(--canard);color:#fff}
.etapes button:disabled:not(.actuelle){opacity:.4}
.bloc{border-top:1px solid #1E3650;padding-top:14px;margin-top:14px}
.bloc h3{font-size:17px;margin-bottom:8px}
.ligne{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
.volet input[type=text],.volet input[type=email],.volet input[type=date],.volet select,.volet textarea{
  width:100%;padding:8px 10px;background:rgba(255,255,255,.06);border:1px solid var(--bord);border-radius:4px;outline:none;color:var(--texte)}
.volet input:focus,.volet select:focus,.volet textarea:focus{border-color:var(--jaune)}
.volet select option{background:#0C1F33}
textarea{min-height:60px;resize:vertical}
.chrono{list-style:none;margin:0;padding:0}
.chrono li{display:grid;grid-template-columns:86px 1fr;gap:10px;padding:7px 0;border-top:1px solid rgba(255,255,255,.06);font-size:14px}
.chrono li:first-child{border-top:0}
.chrono .d{color:var(--gris);font-variant-numeric:tabular-nums}
.chrono .etape{color:var(--cyan)}
.chrono .rappel{color:#FFB667}
.chrono .creation{color:var(--gris)}
.chrono .mail{color:#CFE6EE}
.mail-attente b{display:block;color:#EDF6FA;font-weight:600}
.mail-attente span{display:block;margin-top:2px}
.mail-attente select{flex:1;min-width:180px}
.rappels li{grid-template-columns:1fr auto}
.rappels .echu{color:#FFB667;font-weight:600}
.petits{display:flex;gap:6px}
form.fiche label{display:block;margin-top:10px;font-size:13.5px;color:var(--gris)}
form.fiche label input,form.fiche label select,form.fiche label textarea{margin-top:3px;display:block}
.volet input[type=number]{width:100%;padding:8px 10px;background:rgba(255,255,255,.06);border:1px solid var(--bord);border-radius:4px;outline:none;color:var(--texte)}
.volet optgroup{background:#0C1F33;color:var(--gris)}
form.fiche .deux{display:grid;grid-template-columns:1fr 1fr;gap:12px}
form.fiche .case{display:flex;gap:8px;align-items:center;color:var(--texte)}
form.fiche .case input{width:16px;height:16px;accent-color:var(--jaune);margin:0}
.apercu{margin-top:12px;font-size:13.5px;background:rgba(51,131,139,.14);border-left:3px solid var(--canard);padding:8px 12px}
.erreur{color:#FF8A8A;margin-top:10px;font-size:13.5px;min-height:1em}
table.classes{width:100%;border-collapse:collapse;margin-top:8px}
table.classes td,table.classes th{padding:7px 8px;border-top:1px solid rgba(255,255,255,.07);text-align:left;font-size:13.5px}
table.classes th{color:var(--gris);font-weight:600}
table.classes tr.l{cursor:pointer}
table.classes tr.l:hover{background:rgba(255,255,255,.04)}

/* fenêtre de confirmation d'étape */
dialog{border:1px solid var(--bord);background:var(--ardoise);color:var(--texte);border-radius:10px;padding:22px 24px;max-width:420px;width:92%;box-shadow:0 24px 60px rgba(0,0,0,.6)}
dialog::backdrop{background:rgba(4,10,18,.7)}
dialog h3{font-size:19px;margin-bottom:10px}
dialog label{display:block;margin-top:10px;font-size:13.5px;color:var(--gris)}
dialog input,dialog select{display:block;width:100%;margin-top:3px;padding:8px 10px;background:rgba(255,255,255,.07);border:1px solid var(--bord);border-radius:4px;color:var(--texte)}
dialog select option{background:var(--ardoise)}
dialog .boutons{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}

/* dépôt de mail */
.depot{border:1.5px dashed #2F6E86;border-radius:8px;padding:22px 16px;color:#9FC4D2;text-align:center;background:rgba(109,213,220,.04);margin-top:10px}
.depot-titre{font-family:Georgia,serif;font-size:16px;color:#CDEFF4}
.depot-aide{font-size:12.5px;color:var(--gris);margin-top:4px}
.depot:hover,.depot.survol{border-color:var(--jaune);color:#FFE38A;background:rgba(255,201,0,.06)}
.lu{border-left:3px solid var(--cyan);background:rgba(109,213,220,.07);padding:10px 12px;margin-top:10px;font-size:13.5px}
.lu b{display:block;color:#EDF6FA;font-weight:600;margin-bottom:2px}
.lu .apercu-mail{color:var(--gris);margin-top:6px;font-style:italic}
.prerempli{border-left:3px solid var(--cyan)!important}
#rideau{position:fixed;inset:0;z-index:50;background:rgba(8,22,37,.82);display:flex;align-items:center;justify-content:center;pointer-events:none}
#rideau div{border:2px dashed var(--jaune);border-radius:12px;padding:40px 60px;font-family:Georgia,serif;font-size:22px;color:#FFE38A}

/* écran d'accès */
.acces{max-width:400px;margin:14vh auto;background:var(--ardoise);border:1px solid var(--bord);border-radius:10px;padding:26px;box-shadow:0 24px 60px rgba(0,0,0,.5)}
.acces h1{font-size:26px;letter-spacing:.14em;margin-bottom:6px}
.acces p{color:var(--gris);margin:0 0 16px;font-size:14px}
.acces input{width:100%;padding:11px 13px;background:rgba(255,255,255,.07);border:1px solid var(--bord);border-radius:6px;outline:none;margin-bottom:12px}
.acces input:focus{border-color:var(--jaune)}

@media (max-width:1040px){.panneau{display:none}}
@media (max-width:720px){
  html,body{height:auto} body{overflow:auto;display:block}
  .ciel{display:none} .repli{display:block} .barre{flex-wrap:wrap} .champ{width:100%;margin-left:0}
}
@media (prefers-reduced-motion:reduce){
  .influx{display:none} .gire,.gire-inv,.reacteur,.halo-coeur,.pulse,.segment.allumage{animation:none} .sablier.clignote use{animation:none;opacity:1}
}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="i-dossier" viewBox="0 0 24 24"><path class="ico" d="M3 7h6l2 2h10v10H3z"/><path class="ico" d="M3 7V5h6"/></symbol>
  <symbol id="i-cloche" viewBox="0 0 24 24"><path class="ico" d="M6 17V11a6 6 0 0 1 12 0v6l2 2H4z"/><path class="ico" d="M10 21h4"/></symbol>
  <symbol id="i-sablier" viewBox="0 0 24 24"><path class="ico" d="M6 3h12M6 21h12M7 3c0 5 10 6 10 9s-10 4-10 9M17 3c0 5-10 6-10 9s10 4 10 9"/><path class="ico" d="M10 18h4"/></symbol>
  <symbol id="i-plume" viewBox="0 0 24 24"><path class="ico" d="M20 4C10 5 6 10 5 19l3-3c7 0 11-4 12-12z"/><path class="ico" d="M4 20l6-6"/></symbol>
</defs></svg>

<section class="acces cache" id="ecran-acces">
  <h1>SUIVI</h1>
  <p>Suivi des dossiers. Saisissez votre code d’accès.</p>
  <form id="form-acces">
    <input type="password" id="code" autocomplete="current-password" aria-label="Code d’accès" required>
    <button class="bouton fort" type="submit">Ouvrir</button>
    <div class="erreur" id="erreur-acces"></div>
  </form>
</section>

<div id="appli" class="cache">
  <div class="enveloppe" style="flex:none">
    <div class="barre">
      <div class="marque"><div class="trait"></div><div><b>SUIVI</b><span class="mono" id="date-jour"></span></div></div>
      <label class="champ"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5L21 21"/></svg>
        <input type="search" id="recherche" placeholder="Chercher un dossier, une partie…" aria-label="Chercher un dossier"></label>
      <button class="bouton fort" id="nouveau">Nouveau dossier</button>
      <button class="bouton" id="verrouiller">Verrouiller</button>
    </div>
    <p class="fete cache" id="fete"></p>
  </div>

  <div class="enveloppe ciel" id="ciel" style="flex:1">
    <svg class="carte" id="carte" viewBox="0 0 1000 700" role="img" aria-label="Les dossiers, rangés par type autour d’un anneau"></svg>
    <aside class="panneau" id="panneau" aria-live="polite"></aside>
  </div>
  <div class="enveloppe repli" id="repli"></div>

  <footer><div class="enveloppe">
    <div class="legende">
      <span title="Chaque dossier s’éloigne du centre au fil du temps ; le bord de son secteur marque la durée moyenne de son type">Bord = délai moyen du type</span>
      <span><i style="background:var(--orange)"></i>Délai proche ou dépassé</span>
      <span><svg width="11" height="11" style="vertical-align:-1px;margin-right:5px;color:#FFB667" aria-hidden="true"><use href="#i-sablier"/></svg>Sablier : date limite dans 3 jours ; clignotant : dépassée</span>
      <span><i style="background:var(--rouge)"></i>Signature ou échéance dépassée</span>
      <span id="compte-dossiers"></span>
    </div>
    <span><button class="lien" id="voir-collaborateurs">Collaborateurs (<span id="n-collab">0</span>)</button> · <button class="lien" id="voir-classes">Signés, abandonnés et clos (<span id="n-classes">0</span>)</button></span>
  </div></footer>
</div>

<div id="rideau" class="cache"><div>Déposez le mail : SUIVI prépare la fiche</div></div>
<div class="voile cache" id="voile"></div>
<aside class="volet cache" id="volet" role="dialog" aria-modal="true"></aside>

<dialog id="dlg-delai">
  <form method="dialog">
    <h3 id="dlg-delai-titre">Réajuster la date limite</h3>
    <p class="sous" id="dlg-delai-actuelle"></p>
    <label>Nouvelle date limite<input type="date" id="dlg-delai-date" required></label>
    <label>Motif du report (obligatoire)<textarea id="dlg-delai-motif" class="motif-requis" maxlength="500" rows="3" placeholder="Pourquoi le délai est-il reporté ?"></textarea></label>
    <div class="erreur" id="dlg-delai-erreur"></div>

      <button class="bouton" value="annuler" formnovalidate>Annuler</button>

<dialog id="dlg-etape">

    <h3 id="dlg-titre"></h3>
    <label>Date<input type="date" id="dlg-date" required></label>
    <div id="dlg-motif-bloc" class="cache">
      <label>Motif<select id="dlg-motif"></select></label>
      <label id="dlg-libre-bloc" class="cache">Précisez le motif<input type="text" id="dlg-libre" maxlength="200"></label>
    </div>
    <div class="erreur" id="dlg-erreur"></div>

      <button class="bouton" value="annuler" formnovalidate>Annuler</button>
      <button class="bouton fort" value="valider" id="dlg-valider">Valider</button>
    </div>
  </form>
</dialog>

<script>
'use strict';
var C = window.SuiviCalendrier, T = window.SuiviTypes;
var CLE = 'suivi.code';
var etat = { aujourdhui: C.aujourdhui(), collaborateurs: [], dossiers: [], rappels: [], echeances: [], motifs: [], motifsCloture: [], libellesEcheance: [], ouvert: null, choisi: null, jour: null, releves: null };
var LIBELLES = { en_cours: 'En cours', avant_contrat: 'Avant-contrat', signe: 'Signé', abandonne: 'Abandonné', formalites: 'Formalités', clos: 'Clore' };
var ORANGE = '#FF982D', ROUGE = '#E0456E';
var COULEURS_LITURGIQUES = { blanc: '#E9D99A', rouge: '#E0456E', vert: '#46B98A', violet: '#B07CCB' };

function $(id) { return document.getElementById(id); }
function el(tag, attrs, enfants) {
  var n = document.createElement(tag);
  if (attrs) for (var k in attrs) {
    if (k === 'texte') n.textContent = attrs[k];
    else if (k === 'classe') n.className = attrs[k];
    else if (k.slice(0, 2) === 'on') n.addEventListener(k.slice(2), attrs[k]);
    else n.setAttribute(k, attrs[k]);
  }
  (enfants || []).forEach(function (e) { if (e) n.appendChild(typeof e === 'string' ? document.createTextNode(e) : e); });
  return n;
}
var NS = 'http://www.w3.org/2000/svg';
function sv(tag, attrs) { var n = document.createElementNS(NS, tag); for (var k in attrs || {}) n.setAttribute(k, attrs[k]); return n; }
function fr(s) { return s ? s.split('-').reverse().join('/') : ''; }
function dateLongue(s) { return new Date(s + 'T12:00:00Z').toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric', timeZone: 'UTC' }); }
function ecart(a, b) { return Math.round((Date.parse(b) - Date.parse(a)) / 86400000); }
function sansAccent(s) { return (s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase(); }

function api(methode, donnees) {
  var opt = { method: methode, headers: { 'x-suivi-code': sessionStorage.getItem(CLE) || '' } };
  var url = '/api/suivi';
  if (methode === 'GET') url += '?' + new URLSearchParams(donnees).toString();
  else { opt.headers['Content-Type'] = 'application/json'; opt.body = JSON.stringify(donnees); }
  return fetch(url, opt).then(function (r) {
    return r.json().catch(function () { return {}; }).then(function (j) {
      if (r.status === 401) { verrouiller(); throw new Error(j.erreur || 'Code incorrect.'); }
      if (!r.ok) throw new Error(j.erreur || 'Erreur ' + r.status);
      return j;
    });
  });
}
function alerte(err) { window.alert(err.message); }

/* ---------- Accès ---------- */
function verrouiller() {
  sessionStorage.removeItem(CLE); fermerVolet();
  $('appli').classList.add('cache'); $('ecran-acces').classList.remove('cache'); $('code').value = ''; $('code').focus();
}
$('form-acces').addEventListener('submit', function (e) {
  e.preventDefault(); sessionStorage.setItem(CLE, $('code').value); $('erreur-acces').textContent = '';
  demarrer().catch(function (err) { $('erreur-acces').textContent = err.message; });
});
$('verrouiller').addEventListener('click', verrouiller);
function chargerCollaborateurs() {
  return api('GET', { action: 'collaborateurs' }).then(function (j) { etat.collaborateurs = j.collaborateurs || []; $('n-collab').textContent = etat.collaborateurs.length; })
    .catch(function () { etat.collaborateurs = []; });
}
/* nom affiché d'une adresse de l'étude */
function nomEtude(a) {
  if (T.estPartagee(a)) return T.libellePartagee(a);
  var c = etat.collaborateurs.filter(function (x) { return x.adresse === a; })[0];
  return c ? ((c.prenom ? c.prenom + ' ' : '') + c.nom) : a;
}
function demarrer() {
  chargerCollaborateurs();
  return api('GET', { action: 'etat' }).then(function (j) {
    etat.aujourdhui = j.aujourdhui; etat.motifs = j.motifs_abandon; etat.motifsCloture = j.motifs_cloture || ['Simple demande de renseignement']; etat.libellesEcheance = j.libelles_echeance || []; etat.jour = j;
    $('ecran-acces').classList.add('cache'); $('appli').classList.remove('cache');
    afficherJour(j);
    return charger().then(function () {
      lireReleves();
      if (!etat.minuterie) etat.minuterie = setInterval(function () { if (sessionStorage.getItem(CLE)) lireReleves(); }, 15 * 60000);
    });
  });
}

/* ---------- Date, signet et fête du jour ---------- */
function afficherJour(j) {
  etat.jour = j;
  $('date-jour').textContent = dateLongue(j.aujourdhui);
  var couleur = (j.jour && j.jour.couleur) || j.couleur_du_temps;
  etat.signet = COULEURS_LITURGIQUES[couleur] || '#33838B';
  var f = $('fete');
  if (j.jour) {
    var genre = j.jour.solennite ? (j.jour.ferie ? 'Solennité, jour férié' : 'Solennité') : 'Jour férié';
    f.textContent = genre + ' : ' + j.jour.nom + '. Aucune relance n’est envoyée aujourd’hui.';
    f.className = 'fete ' + couleur;
  } else f.className = 'fete cache';
  if (etat.dossiers.length || $('carte').childNodes.length) dessiner();
}

/* ---------- Données ---------- */
function charger() {
  return api('GET', { action: 'liste' }).then(function (j) {
    etat.aujourdhui = j.aujourdhui; etat.dossiers = j.dossiers; etat.rappels = j.rappels_echus; etat.echeances = j.echeances_proches || []; etat.releves = j.releves || null;
    dessiner();
  });
}
function actif(d) { return !d.classe_le || d.classe_le > etat.aujourdhui; }
function signatureDepassee(d) { return d.signature_prevue && d.signature_prevue < etat.aujourdhui && !d.signature_le && d.etape !== 'abandonne'; }
function echeanceDepassee(d) { return d.prochaine_echeance && d.prochaine_echeance < etat.aujourdhui && !d.signature_le && d.etape !== 'abandonne'; }
/* 2 = rouge (signature ou échéance de l'acte dépassée) ; le rappel dû se marque par la cloche */
function niveau(d) { return signatureDepassee(d) || echeanceDepassee(d) ? 2 : 0; }
function nomCourt(d) {
  var p1 = (d.partie1 || '').toUpperCase(), p2 = (d.partie2 || '').toUpperCase();
  var n = p2 ? p1 + ' / ' + p2 : p1;
  return n.length > 20 ? n.slice(0, 19) + '…' : n;
}
function aTraiter() {
  var l = [];
  etat.rappels.forEach(function (r) { l.push({ type: 'rappel', r: r }); });
  etat.echeances.forEach(function (x) { l.push({ type: 'echeance', x: x, n: ecart(etat.aujourdhui, x.echeance) }); });
  etat.dossiers.filter(actif).forEach(function (d) { if (T.sablier(d, etat.aujourdhui) === 'depasse') l.push({ type: 'sablier', d: d, fin: T.delais(d, etat.aujourdhui).fin }); });
  etat.dossiers.filter(actif).forEach(function (d) {
    if (d.signature_le || d.etape === 'abandonne' || !d.signature_prevue) return;
    var n = ecart(etat.aujourdhui, d.signature_prevue);
    if (n < 0) l.push({ type: 'depassee', d: d });
    else if (n <= 15) l.push({ type: 'proche', d: d, n: n });
  });
  return l;
}

/* ---------- L'anneau ---------- */
var CX = 500, CY = 350, R_COEUR = 124;
var rad = function (a) { return a * Math.PI / 180; };
var surCercle = function (a, r) { return [CX + Math.cos(rad(a)) * r, CY + Math.sin(rad(a)) * r]; };
function arcD(r, a1, a2) {
  var p = surCercle(a1, r), q = surCercle(a2, r);
  return 'M' + p[0].toFixed(1) + ',' + p[1].toFixed(1) + ' A' + r + ',' + r + ' 0 ' + ((a2 - a1) > 180 ? 1 : 0) + ' 1 ' + q[0].toFixed(1) + ',' + q[1].toFixed(1);
}
function hexa(cx, cy, r) {
  var p = [];
  for (var k = 0; k < 6; k++) { var a = rad(-90 + k * 60); p.push((cx + Math.cos(a) * r).toFixed(1) + ',' + (cy + Math.sin(a) * r).toFixed(1)); }
  return p.join(' ');
}

/* ---------- L'anneau par type de dossier ----------
   Un secteur par type ouvert (largeur selon le nombre de dossiers, secteurs vides masqués),
   rangés par matière. Chaque dossier a son rayon : il part du centre à l'ouverture et
   s'éloigne jusqu'au bord, qui marque la durée moyenne du type ; sa teinte vire à
   l'orange à l'approche de ce délai. Les signés (formalités) sont au-delà du bord, avec la plume. */
var R_ANNEAU = 151, R0 = 158, R1 = 302, R_SIGNES = 338, R_MAT = 366;
var GRADUATIONS = [0.25, 0.5, 0.75];
function rayonDe(part) { return R0 + (R1 - R0) * Math.min(part, 1.04); }
function melange(c1, c2, k) {
  var a = parseInt(c1.slice(1), 16), b = parseInt(c2.slice(1), 16);
  var r = Math.round((a >> 16) + ((b >> 16) - (a >> 16)) * k), g = Math.round(((a >> 8) & 255) + (((b >> 8) & 255) - ((a >> 8) & 255)) * k), bl = Math.round((a & 255) + ((b & 255) - (a & 255)) * k);
  return '#' + ((1 << 24) | (r << 16) | (g << 8) | bl).toString(16).slice(1);
}
function teinteDe(d, x) {
  if (niveau(d) === 2) return ROUGE;
  if (d.signature_le) return x.type.couleur;
  var k = Math.max(0, Math.min(1, (x.part - 0.5) / 0.5));     /* l'orange monte à partir de la moitié du délai */
  return melange(x.type.couleur, ORANGE, k);
}

function secteurs(dossiers) {
  var par = {};
  dossiers.forEach(function (d) { var t = T.type(d.type_dossier).id; (par[t] = par[t] || []).push(d); });
  var res = [];
  T.MATIERES.forEach(function (m) {
    T.TYPES.forEach(function (t) {
      if (t.matiere !== m.id || !par[t.id]) return;
      var l = par[t.id].slice().sort(function (a, b) { return (a.date_ouverture || '').localeCompare(b.date_ouverture || '') || a.id - b.id; });
      res.push({ type: t, matiere: m, tous: l });
    });
  });
  return res;
}

function dessiner() {
  var carte = $('carte'); carte.textContent = '';
  var actifs = etat.dossiers.filter(actif);
  var classes = etat.dossiers.filter(function (d) { return !actif(d); });
  $('n-classes').textContent = classes.length;
  $('compte-dossiers').textContent = actifs.length + (actifs.length > 1 ? ' dossiers ouverts' : ' dossier ouvert');

  var defs = sv('defs'); carte.appendChild(defs);
  defs.innerHTML = '<radialGradient id="halo-hud"><stop offset="0%" stop-color="#33838B" stop-opacity=".5"/><stop offset="68%" stop-color="#0F2238" stop-opacity=".3"/><stop offset="100%" stop-color="#081625" stop-opacity="0"/></radialGradient>' +
    '<radialGradient id="reacteur-hud"><stop offset="0%" stop-color="#EAFEFF" stop-opacity=".95"/><stop offset="40%" stop-color="#6DD5DC" stop-opacity=".55"/><stop offset="100%" stop-color="#33838B" stop-opacity="0"/></radialGradient>' +
    '<filter id="lueur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.2" result="f"/><feMerge><feMergeNode in="f"/><feMergeNode in="SourceGraphic"/></feMerge></filter>' +
    '<radialGradient id="ecran-hud" cx="50%" cy="42%" r="72%"><stop offset="0%" stop-color="#17384F"/><stop offset="62%" stop-color="#102A40"/><stop offset="100%" stop-color="#0A1C2C"/></radialGradient>';

  coeur(carte);
  var lots = secteurs(actifs);
  dessinerRepli(lots);
  if (!lots.length) {
    carte.appendChild(sv('circle', { cx: CX, cy: CY, r: R1, fill: 'none', stroke: '#27425B', 'stroke-dasharray': '2 7' }));
    var v = sv('text', { 'class': 'vide-arc', x: CX, y: CY + R1 + 26, 'text-anchor': 'middle' });
    v.textContent = 'Aucun dossier ouvert — « Nouveau dossier » pour commencer'; carte.appendChild(v);
    $('carte').setAttribute('viewBox', (CX - R_MAT - 30) + ' ' + (CY - R_MAT - 30) + ' ' + (2 * R_MAT + 60) + ' ' + (2 * R_MAT + 80));
    if (etat.choisi == null) panneauATraiter();
    return;
  }

  /* largeur de chaque secteur : proportionnelle à ses dossiers, avec un minimum pour que son titre tienne */
  var rT = R_COEUR + 12;
  var besoins = lots.map(function (l) { return Math.min(70, ((l.type.court.length + 3) * 6.6 / rT) * 180 / Math.PI + 6); });
  var total = actifs.length;
  var spans = lots.map(function (l) { return l.tous.length * 360 / total; });
  if (lots.length === 1) spans = [360];
  else for (var tour = 0; tour < 6; tour++) {
    spans = spans.map(function (x, i) { return Math.max(x, besoins[i]); });
    var somme = spans.reduce(function (a, b) { return a + b; }, 0);
    spans = spans.map(function (x) { return x * 360 / somme; });
  }
  /* taille des écussons : elle suit l'écart le plus serré au départ des rayons */
  var pasMin = Math.min.apply(null, spans.map(function (s, i) { return s / lots[i].tous.length; }));
  var debut = -90 - spans[0] / 2, recherche = sansAccent($('recherche').value.trim());
  var aPlacer = [], ecussons = [], allumage = 0, matPrec = null, matDebut = 0;
  var traitsMat = [];

  lots.forEach(function (lot, n) {
    var t = lot.type, span = spans[n], a1 = debut + (lots.length > 1 ? 0.8 : 0), a2 = debut + span - (lots.length > 1 ? 0.8 : 0);
    var plein = lots.length === 1;
    /* bande du secteur sur l'anneau */
    var dBande = plein ? 'M' + (CX + R_ANNEAU) + ',' + CY + ' a' + R_ANNEAU + ',' + R_ANNEAU + ' 0 1 1 -' + (2 * R_ANNEAU) + ',0 a' + R_ANNEAU + ',' + R_ANNEAU + ' 0 1 1 ' + (2 * R_ANNEAU) + ',0' : arcD(R_ANNEAU, a1, a2);
    carte.appendChild(sv('path', { d: dBande, fill: 'none', stroke: t.couleur, 'stroke-opacity': '.85', 'stroke-width': '9' }));
    var flux = sv('path', { 'class': 'influx', d: dBande, stroke: '#EAFEFF', 'stroke-opacity': '.45' });
    flux.style.setProperty('--long', Math.round(R_ANNEAU * rad(a2 - a1))); flux.style.setProperty('--vitesse', (4 + lot.tous.length * 0.6).toFixed(1) + 's');
    carte.appendChild(flux);
    /* graduations (quarts du délai moyen) et bord = délai moyen */
    GRADUATIONS.forEach(function (g) {
      var r = rayonDe(g);
      carte.appendChild(sv('path', { d: plein ? cercleD(r) : arcD(r, a1, a2), fill: 'none', stroke: t.couleur, 'stroke-opacity': '.16', 'stroke-width': '1', 'stroke-dasharray': '2 5' }));
    });
    carte.appendChild(sv('path', { d: plein ? cercleD(R1) : arcD(R1, a1, a2), fill: 'none', stroke: t.couleur, 'stroke-opacity': '.55', 'stroke-width': '1.6' }));
    /* séparation entre secteurs */
    if (!plein) {
      var s1 = surCercle(debut, R_ANNEAU - 6), s2 = surCercle(debut, R_SIGNES + 14);
      carte.appendChild(sv('line', { x1: s1[0].toFixed(1), y1: s1[1].toFixed(1), x2: s2[0].toFixed(1), y2: s2[1].toFixed(1), stroke: '#1E3A54', 'stroke-width': '1' }));
    }
    /* durée moyenne inscrite au bord */
    var duree = lot.tous.length === 1 ? T.delais(lot.tous[0], etat.aujourdhui).duree : null;
    var libBord = t.mois ? t.mois + ' MOIS' : (t.ajustable && duree && duree !== t.delai ? duree : t.delai) + ' J';
    var pb = surCercle((a1 + a2) / 2, R1 + 11);
    var tb = sv('text', { 'class': 'borne', x: pb[0].toFixed(1), y: (pb[1] + 3).toFixed(1), 'text-anchor': 'middle', fill: t.couleur });
    tb.textContent = libBord; carte.appendChild(tb);
    ecussons.push({ x: pb[0], y: pb[1], m: 18 });

    /* titre du secteur, le long de l'anneau, à rebours en bas pour se lire de gauche à droite */
    var milieu = (a1 + a2) / 2, bas = Math.sin(rad(milieu)) > 0.2;
    var b1 = plein ? -150 : a1, b2 = plein ? -30 : a2;
    var pa = surCercle(bas ? b2 : b1, rT), pz = surCercle(bas ? b1 : b2, rT);
    var chemin = sv('path', { id: 'titre-' + t.id, fill: 'none', d: 'M' + pa[0].toFixed(1) + ',' + pa[1].toFixed(1) + ' A' + rT + ',' + rT + ' 0 ' + ((b2 - b1) > 180 ? 1 : 0) + ' ' + (bas ? 0 : 1) + ' ' + pz[0].toFixed(1) + ',' + pz[1].toFixed(1) });
    defs.appendChild(chemin);
    var tt = sv('text', { 'class': 'titre-arc', fill: t.couleur, dy: bas ? '7' : '0' });
    var tp = sv('textPath', { href: '#titre-' + t.id, startOffset: '50%', 'text-anchor': 'middle' });
    tp.textContent = (span < besoins[n] - 2 ? t.court.split(' ')[0] : t.court) + '  ' + lot.tous.length;
    tt.appendChild(tp); carte.appendChild(tt);

    /* arc de matière, tout à l'extérieur */
    if (lot.matiere.id !== matPrec) { if (matPrec) traitsMat.push({ m: traitsMat.m, a1: matDebut, a2: debut }); matPrec = lot.matiere.id; matDebut = debut; traitsMat.m = lot.matiere; }

    /* les dossiers, chacun sur son rayon */
    var pas = (a2 - a1) / lot.tous.length;
    lot.tous.forEach(function (d, i) {
      var x = T.delais(d, etat.aujourdhui);
      var ang = a1 + pas * (i + 0.5);
      var r = d.signature_le ? R_SIGNES : rayonDe(x.part);
      var m = surCercle(ang, r), xm = m[0], ym = m[1];
      var niv = niveau(d), teinte = teinteDe(d, x), rappelDu = d.rappels_echus > 0;
      var g = sv('g', { 'class': 'module', tabindex: '0', role: 'button' });
      g.setAttribute('aria-label', d.intitule + ', ' + t.nom);
      g.dataset.id = d.id;
      var cherche = sansAccent([d.intitule, d.partie1, d.partie2, d.numero, d.nom_outlook, t.nom].join(' '));
      if (recherche && cherche.indexOf(recherche) < 0) g.classList.add('eteint');
      if (etat.choisi === d.id) g.classList.add('choisi');
      aPlacer.push({ g: g, d: d, ang: ang, r: r, teinte: teinte, niv: niv, rappelDu: rappelDu, signe: !!d.signature_le, sab: T.sablier(d, etat.aujourdhui), rang: allumage++ });
      g.addEventListener('mouseenter', function () { montrer(d); });
      g.addEventListener('focus', function () { montrer(d); });
      g.addEventListener('click', function () { ouvrir(d.id); });
      g.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); ouvrir(d.id); } });
      carte.appendChild(g);
    });
    debut += span;
  });
  traitsMat.push({ m: traitsMat.m, a1: matDebut, a2: debut });
  traitsMat.forEach(function (tm, i) {
    var plein = traitsMat.length === 1 && lots.length > 0 && Math.abs(tm.a2 - tm.a1 - 360) < 0.5;
    var a1 = tm.a1 + 1.5, a2 = tm.a2 - 1.5;
    carte.appendChild(sv('path', { d: plein ? cercleD(R_MAT) : arcD(R_MAT, a1, a2), fill: 'none', stroke: tm.m.couleur, 'stroke-opacity': '.5', 'stroke-width': '2', 'stroke-linecap': 'round' }));
    var mil = plein ? -90 : (a1 + a2) / 2, bas = Math.sin(rad(mil)) > 0.2, rr = R_MAT + (bas ? 15 : 8);
    var c1 = plein ? -130 : a1, c2 = plein ? -50 : a2;
    var pa = surCercle(bas ? c2 : c1, rr), pz = surCercle(bas ? c1 : c2, rr);
    defs.appendChild(sv('path', { id: 'mat-' + i, fill: 'none', d: 'M' + pa[0].toFixed(1) + ',' + pa[1].toFixed(1) + ' A' + rr + ',' + rr + ' 0 ' + ((c2 - c1) > 180 ? 1 : 0) + ' ' + (bas ? 0 : 1) + ' ' + pz[0].toFixed(1) + ',' + pz[1].toFixed(1) }));
    var t = sv('text', { 'class': 'titre-mat', fill: tm.m.couleur });
    var tp = sv('textPath', { href: '#mat-' + i, startOffset: '50%', 'text-anchor': 'middle' });
    tp.textContent = tm.m.nom.toUpperCase(); t.appendChild(tp); carte.appendChild(t);
  });
  poserBarres(aPlacer, Math.max(9, Math.min(16, R_ANNEAU * rad(pasMin) * 0.62)), pasMin);
  cadrer(aPlacer);
  setTimeout(function () { carte.querySelectorAll('.segment.allumage').forEach(function (n) { n.classList.remove('allumage'); }); }, 1600);
  if (etat.choisi == null) panneauATraiter();
}
function cercleD(r) { return 'M' + (CX + r) + ',' + CY + ' a' + r + ',' + r + ' 0 1 1 -' + (2 * r) + ',0 a' + r + ',' + r + ' 0 1 1 ' + (2 * r) + ',0'; }

/* Chaque dossier est une barre posée sur son rayon, dont un côté touche l'anneau du centre.
   La barre court jusqu'au bord du secteur (le délai moyen du type) ; sa partie pleine
   montre le temps écoulé, et sa teinte vire à l'orange à l'approche du délai.
   Le nom du dossier est écrit dans la barre, dans le sens de la lecture. */
var FORME = 'eventail';   /* 'segments' (barre à segments, façon PHARE), 'eventail' (part d'anneau), 'jauge' (barre pleine) */
function secteurD(a1, a2, r1, r2) {
  var p1 = surCercle(a1, r1), p2 = surCercle(a1, r2), p3 = surCercle(a2, r2), p4 = surCercle(a2, r1), g = (a2 - a1) > 180 ? 1 : 0;
  return 'M' + p1[0].toFixed(1) + ',' + p1[1].toFixed(1) + ' L' + p2[0].toFixed(1) + ',' + p2[1].toFixed(1) +
    ' A' + r2 + ',' + r2 + ' 0 ' + g + ' 1 ' + p3[0].toFixed(1) + ',' + p3[1].toFixed(1) + ' L' + p4[0].toFixed(1) + ',' + p4[1].toFixed(1) +
    ' A' + r1 + ',' + r1 + ' 0 ' + g + ' 0 ' + p1[0].toFixed(1) + ',' + p1[1].toFixed(1) + ' Z';
}
function poserBarres(liste, largeur, pas) {
  var w = largeur, debutB = R_ANNEAU + 7, taille = Math.max(7.5, Math.min(10, w - 4));
  liste.forEach(function (e) {
    var g = e.g, teinte = e.teinte, ang = e.ang, t = T.type(e.d.type_dossier);
    var fin = e.signe ? R_SIGNES : Math.max(R1, e.r), plein = e.signe ? R_SIGNES : Math.max(debutB + 4, e.r);
    var rot = 'rotate(' + ang.toFixed(2) + ' ' + CX + ' ' + CY + ')', y = CY - w / 2;
    var couleurA = function (r) { /* la couleur suit la position : teinte du type, puis orange après la moitié du délai */
      if (e.niv) return ROUGE; if (e.signe) return t.couleur;
      var part = (r - R0) / (R1 - R0); return melange(t.couleur, ORANGE, Math.max(0, Math.min(1, (part - 0.5) / 0.5)));
    };
    if (FORME === 'eventail') {
      var dA = Math.min(pas * 0.42, 14);
      g.appendChild(sv('path', { 'class': 'cadre-survol', d: secteurD(ang - dA - 0.8, ang + dA + 0.8, debutB - 3, fin + 3), fill: 'none', stroke: teinte, 'stroke-width': '1.2' }));
      g.appendChild(sv('path', { 'class': 'ecusson', d: secteurD(ang - dA, ang + dA, debutB, fin), fill: t.couleur, 'fill-opacity': '.07', stroke: t.couleur, 'stroke-opacity': '.35', 'stroke-width': '1' }));
      var part = sv('path', { 'class': 'segment allumage', d: secteurD(ang - dA, ang + dA, debutB, plein), fill: 'url(#deg-' + e.d.id + ')', opacity: e.signe ? '.5' : '.9', 'pointer-events': 'none', filter: 'url(#lueur)' });
      var p0 = surCercle(ang, debutB), p1 = surCercle(ang, R1);
      var deg = sv('linearGradient', { id: 'deg-' + e.d.id, gradientUnits: 'userSpaceOnUse', x1: p0[0].toFixed(1), y1: p0[1].toFixed(1), x2: p1[0].toFixed(1), y2: p1[1].toFixed(1) });
      [[0, couleurA(R0)], [0.5, couleurA(R0 + (R1 - R0) * 0.5)], [1, couleurA(R1)]].forEach(function (st) { deg.appendChild(sv('stop', { offset: st[0], 'stop-color': st[1] })); });
      $('carte').querySelector('defs').appendChild(deg);
      part.style.setProperty('--opf', e.signe ? '.5' : '.9'); part.style.animationDelay = (80 + e.rang * 35) + 'ms';
      g.appendChild(part);
      /* liseré lumineux au front de progression */
      if (!e.signe) g.appendChild(sv('path', { d: arcD(plein, ang - dA, ang + dA), fill: 'none', stroke: '#F4FBFD', 'stroke-width': '1.6', 'stroke-opacity': '.85', 'pointer-events': 'none' }));
    } else if (FORME === 'segments') {
      var seg = 7, inter = 2.4, n = 0;
      g.appendChild(sv('rect', { 'class': 'cadre-survol', x: CX + debutB - 4, y: (y - 4).toFixed(1), width: (fin - debutB + 8).toFixed(1), height: (w + 8).toFixed(1), rx: '3', fill: 'none', stroke: teinte, 'stroke-width': '1.1', transform: rot }));
      g.appendChild(sv('rect', { 'class': 'ecusson', x: CX + debutB, y: y.toFixed(1), width: (fin - debutB).toFixed(1), height: w.toFixed(1), fill: 'transparent', stroke: 'none', transform: rot }));
      var blocs = sv('g', { transform: rot, 'pointer-events': 'none' }), lueur = sv('g', { transform: rot, 'pointer-events': 'none', filter: 'url(#lueur)' });
      for (var r = debutB; r + seg <= fin + 0.5; r += seg + inter, n++) {
        var allume = r + seg / 2 <= plein;
        var rc = sv('rect', { x: (CX + r).toFixed(1), y: y.toFixed(1), width: seg, height: w.toFixed(1), rx: '1', fill: allume ? couleurA(r + seg / 2) : t.couleur, opacity: allume ? (e.signe ? '.5' : '.92') : '.10' });
        if (allume) { rc.setAttribute('class', 'segment allumage'); rc.style.setProperty('--opf', e.signe ? '.5' : '.92'); rc.style.animationDelay = (80 + e.rang * 30 + n * 22) + 'ms'; lueur.appendChild(rc); }

      g.appendChild(sv('rect', { 'class': 'ecusson', x: CX + debutB, y: y.toFixed(1), width: (fin - debutB).toFixed(1), height: w.toFixed(1), rx: '2.5', fill: '#0C2134', stroke: teinte, 'stroke-opacity': '.55', 'stroke-width': '1.1', transform: rot }));
      var rem = sv('rect', { 'class': 'segment allumage', x: CX + debutB, y: y.toFixed(1), width: Math.max(4, plein - debutB).toFixed(1), height: w.toFixed(1), rx: '2.5', fill: teinte, opacity: e.signe ? '.45' : '.85', transform: rot, 'pointer-events': 'none' });
      rem.style.setProperty('--opf', e.signe ? '.45' : '.85'); rem.style.animationDelay = (80 + e.rang * 35) + 'ms';
      g.appendChild(rem);
    }
    /* le nom, dans la barre ; à gauche de l'anneau on le retourne pour qu'il se lise de gauche à droite */
    var dispo = fin - debutB - 12, nom = nomCourt(e.d), max = Math.floor(dispo / (taille * 0.66));
    if (nom.length > max) nom = nom.slice(0, Math.max(3, max - 1)) + '…';
    var gauche = Math.cos(rad(ang)) < -0.01;
    var tx = sv('text', { 'class': 'barre-nom', 'font-size': taille.toFixed(1), y: (CY + taille * 0.36).toFixed(1),
      x: gauche ? (CX - debutB - 7).toFixed(1) : (CX + debutB + 7).toFixed(1), 'text-anchor': gauche ? 'end' : 'start',
      fill: e.niv ? '#FFC2D2' : '#F2F8FB', transform: 'rotate(' + (gauche ? ang + 180 : ang).toFixed(2) + ' ' + CX + ' ' + CY + ')' });
    tx.textContent = nom; g.appendChild(tx);
    var bout = surCercle(ang, fin + 11);
    if (e.rappelDu || e.signe) g.appendChild(sv('use', { href: '#' + (e.rappelDu ? 'i-cloche' : 'i-plume'), x: (bout[0] - 7).toFixed(1), y: (bout[1] - 7).toFixed(1), width: 14, height: 14, color: e.rappelDu ? ORANGE : teinte, 'pointer-events': 'none' }));
    /* sablier : au-delà de la cloche s'il y en a une ; un clic réajuste la date limite */
    var decal = (e.rappelDu || e.signe) ? 25 : 11;
    if (e.sab) {

      gs.setAttribute('aria-label', e.sab === 'depasse' ? 'Date limite dépassée : réajuster' : 'Date limite dans moins de 3 jours : réajuster');
      gs.appendChild(sv('circle', { 'class': 'zone-sab', cx: ps[0].toFixed(1), cy: ps[1].toFixed(1), r: '10' }));
      gs.appendChild(sv('use', { href: '#i-sablier', x: (ps[0] - 7.5).toFixed(1), y: (ps[1] - 7.5).toFixed(1), width: 15, height: 15, color: e.sab === 'depasse' ? ORANGE : '#FFB667', 'pointer-events': 'none' }));
      var ouvrirReport = function (ev) { ev.stopPropagation(); ev.preventDefault(); reporterDelai(e.d); };

function cadrer(liste) {

  var m = 10;
  $('carte').setAttribute('viewBox', Math.round(x0 - m) + ' ' + Math.round(y0 - m) + ' ' + Math.round(x1 - x0 + 2 * m) + ' ' + Math.round(y1 - y0 + 2 * m));

/* Le cœur : le nombre de choses à traiter aujourd'hui, la date et le signet liturgique */

  var g = sv('g', { 'class': 'coeur', 'pointer-events': 'none' }); carte.appendChild(g);
  g.appendChild(sv('circle', { cx: CX, cy: CY, r: R_COEUR + 10, fill: 'url(#halo-hud)', 'class': 'halo-coeur' }));
  // l'anneau extérieur du cadran prend la couleur liturgique du jour (le signet)
  var ext = sv('g', { 'class': 'gire', style: O + ';--tour:44s' });
  [0, 90, 180, 270].forEach(function (a) { ext.appendChild(sv('path', { d: arcD(R_COEUR - 10, a + 5, a + 78), fill: 'none', stroke: etat.signet || '#33838B', 'stroke-opacity': '.85', 'stroke-width': '2.2', 'stroke-linecap': 'round' })); });

    grad.appendChild(sv('line', { x1: p[0].toFixed(1), y1: p[1].toFixed(1), x2: q[0].toFixed(1), y2: q[1].toFixed(1), 'stroke-width': longue ? '1.6' : '1', 'stroke-opacity': longue ? '.95' : '.45' }));
  }

  g.appendChild(sv('circle', { cx: CX, cy: CY, r: R_COEUR - 42, fill: 'none', stroke: '#6DD5DC', 'stroke-opacity': '.3', 'stroke-width': '1.2', 'stroke-dasharray': '3 8', 'class': 'gire-inv', style: O + ';--tour:30s' }));
  g.appendChild(sv('circle', { cx: CX, cy: CY - 46, r: 16, fill: 'url(#reacteur-hud)', 'class': 'reacteur', style: 'transform-origin:' + CX + 'px ' + (CY - 46) + 'px' }));

/* ---------- Le panneau déporté ---------- */
function marquerChoisi() { document.querySelectorAll('#carte .module').forEach(function (m) { m.classList.toggle('choisi', +m.dataset.id === etat.choisi); }); }
function avancement(d) {
  var x = T.delais(d, etat.aujourdhui), t = x.type;
  if (d.signature_le) return { texte: 'Signé le ' + fr(d.signature_le) + ' — classement le ' + fr(d.classe_le), classe: '' };
  var base = t.depuis === 'deces' ? 'Délai fiscal (6 mois après le décès)' : 'Délai moyen ' + x.duree + ' jours';
  if (x.decesManquant) return { texte: 'Date de décès à renseigner — délai compté depuis l’ouverture, au ' + fr(x.fin), classe: 'alerte' };
  if (x.reportee) base = 'Date limite réajustée';
  if (x.reste < 0) return { texte: base + ' dépassé' + (x.reportee ? 'e' : '') + ' de ' + (-x.reste) + ' jour' + (x.reste < -1 ? 's' : '') + ' (' + fr(x.fin) + ')', classe: 'alerte' };
  if (x.reportee) base = 'Date limite réajustée';
  return { texte: base + ' : jour ' + x.ecoule + ' sur ' + x.duree + ', échéance au ' + fr(x.fin), classe: x.part >= 0.75 ? 'alerte' : '' };
}
function montrer(d) {

  p.appendChild(el('h3', { texte: d.intitule }));
  p.appendChild(el('p', { texte: 'Dossier Outlook : ' + d.nom_outlook }));
  var av = avancement(d);
  p.appendChild(el('p', { classe: av.classe, texte: av.texte }));
  if (!d.signature_le) {
    if (d.signature_prevue) p.appendChild(el('p', { classe: signatureDepassee(d) ? 'rouge' : '', texte: 'Signature prévue le ' + fr(d.signature_prevue) + (signatureDepassee(d) ? ' — date dépassée' : '') }));
    else p.appendChild(el('p', { classe: 'alerte', texte: 'Date de signature à renseigner' }));
    if (d.prochaine_echeance) p.appendChild(el('p', { classe: echeanceDepassee(d) ? 'rouge' : '', texte: 'Prochaine échéance de l’acte : ' + fr(d.prochaine_echeance) + (echeanceDepassee(d) ? ' — dépassée' : '') }));

  if (d.rappels_echus) p.appendChild(el('p', { classe: 'alerte', texte: d.rappels_echus + ' rappel' + (d.rappels_echus > 1 ? 's' : '') + ' dû' + (d.rappels_echus > 1 ? 's' : '') }));
  else if (d.rappels_ouverts) p.appendChild(el('p', { texte: d.rappels_ouverts + ' rappel' + (d.rappels_ouverts > 1 ? 's' : '') + ' en attente' }));

    sab ? el('button', { classe: 'bouton petit', texte: sab === 'depasse' ? 'Délai dépassé : réajuster' : 'Réajuster la date limite', onclick: function () { reporterDelai(d); } }) : null]));

/* ---------- Mail glissé : lecture sur le poste et préremplissage ---------- */
var chargementMsg = null;
function lecteurMsg() {
  if (window.MsgReader) return Promise.resolve();
  if (!chargementMsg) chargementMsg = new Promise(function (ok, ko) {
    var s = document.createElement('script'); s.src = '/vendor/msgreader.js'; s.onload = ok; s.onerror = function () { ko(new Error('Lecteur des fichiers .msg indisponible.')); };
    document.head.appendChild(s);
  });
  return chargementMsg;
}
function lireMail(fichier) {
  if (!fichier) return Promise.reject(new Error('Aucun fichier.'));
  if (!/\.(msg|eml)$/i.test(fichier.name) && fichier.type !== 'message/rfc822') return Promise.reject(new Error('Glissez un mail Outlook (fichier .msg ou .eml).'));
  return fichier.arrayBuffer().then(function (buf) {
    var oct = new Uint8Array(buf);
    var msg = /\.msg$/i.test(fichier.name) || (oct[0] === 0xD0 && oct[1] === 0xCF);
    return (msg ? lecteurMsg() : Promise.resolve()).then(function () {
      return SuiviLecture.proposer(SuiviLecture.lireOctets(fichier.name, oct), etat.aujourdhui);
    });
  });
}
function fichierDe(e) {
  var dt = e.dataTransfer; if (!dt) return null;
  if (dt.files && dt.files.length) return dt.files[0];
  return null;
}
/* dossiers qui semblent concernés : une adresse déjà connue, ou les noms des parties dans l'objet */
function candidats(prop) {
  var objet = sansAccent(prop.mail.objet);
  var adr = prop.adresses.concat(prop.etude || []);
  return etat.dossiers.filter(actif).map(function (d) {
    var score = 0;
    (d.adresses || []).forEach(function (a) { if (adr.indexOf(a) >= 0) score += 1; });
    [d.partie1, d.partie2].forEach(function (n) { n = sansAccent(n || '').trim(); if (n.length > 2 && objet.indexOf(n) >= 0) score += 2; });
    if (d.numero && objet.indexOf(sansAccent(d.numero)) >= 0) score += 3;
    return { d: d, score: score };
  }).filter(function (x) { return x.score > 0; }).sort(function (a, b) { return b.score - a.score; }).slice(0, 4);
}

/* ---------- Pont provisoire : relevés des mails déposés dans le Drive (arbitrages du 21/10/2026) ----------
   Des tâches programmées Claude lisent la messagerie et déposent une fiche JSON par relevé dans le dossier
   Drive « SUIVI – relevés ». À l'ouverture (puis toutes les 15 minutes), la page lit les fiches nouvelles
   et les confie au serveur, qui rattache les mails.
   Lecture PAR LE RELAIS (arbitrage du 21/10/2026, le client Google étant plein) : SUIVI ne demande plus
   lui-même de jeton Google. Il ouvre dans un cadre invisible la page relais.html de MORNING (adresse déjà
   autorisée), qui lit le Drive à sa place ; si MORNING ne répond pas en 10 s, bascule sur le relais de
   secours logé dans HISTO. Le jeton ne quitte jamais le relais. Si l'accord Google manque, un encadré
   « Autoriser la lecture du Drive » ouvre le relais dans une petite fenêtre. */
var DOSSIER_RELEVES = 'SUIVI – relevés';

window.addEventListener('message', function (ev) {
  var m = ev.data;
  if (!m || !m.fidalRelais) return;
  if (!RELAIS.some(function (u) { return new URL(u).origin === ev.origin; })) return;
  if (m.fidalRelais === 'pret') { relaisPrets.slice().forEach(function (f) { f(ev); }); return; }
  if (m.fidalRelais === 'reponse' && relaisAttentes[m.n]) { var f = relaisAttentes[m.n]; delete relaisAttentes[m.n]; f(m); }
});
function attendrePret(source, delai) {
  return new Promise(function (res) {
    var fini = false;
    function f(ev) { if (ev.source === source() && !fini) { fini = true; relaisPrets.splice(relaisPrets.indexOf(f), 1); res(ev); } }
    relaisPrets.push(f);
    setTimeout(function () { if (!fini) { fini = true; relaisPrets.splice(relaisPrets.indexOf(f), 1); res(null); } }, delai);
  });
}
function ouvrirRelais() {
  if (relaisActif) return Promise.resolve(relaisActif);
  return RELAIS.reduce(function (p, url) {
    return p.then(function (r) {
      if (r) return r;
      var cadre = document.createElement('iframe');
      cadre.src = url; cadre.title = 'relais Drive'; cadre.setAttribute('aria-hidden', 'true'); cadre.tabIndex = -1;
      cadre.style.cssText = 'position:absolute;width:0;height:0;border:0;visibility:hidden';
      var attente = attendrePret(function () { return cadre.contentWindow; }, 10000);
      document.body.appendChild(cadre);
      return attente.then(function (ev) {
        if (ev) return { cible: cadre.contentWindow, origine: ev.origin, url: url, cadre: cadre };
        cadre.remove(); return null;
      });
    });

  });
}

  return ouvrirRelais().then(function (r) {
    return new Promise(function (res, rej) {
      var n = ++relaisN;
      var minuterie = setTimeout(function () { delete relaisAttentes[n]; rej(new Error('le relais Drive ne répond plus.')); }, 60000);
      relaisAttentes[n] = function (m) {
        clearTimeout(minuterie);
        if (m.ok) return res(m.resultat);
        var e = new Error(m.erreur || 'erreur du relais'); e.accord = !!m.accord; rej(e);
      };

    });
  });
}
function autoriserDrive() {
  var url = (relaisActif && relaisActif.url) || RELAIS[0];
  var fen = window.open(url + '?fenetre=1', 'relaisDriveFidal', 'width=520,height=440');
  if (!fen) { pontMessage = 'Relevés des mails : la fenêtre a été bloquée par le navigateur, autorisez les fenêtres pour SUIVI.'; panneauSiLibre(); return; }
  pontMessage = 'Relevés des mails : accord Google en cours dans la petite fenêtre…'; panneauSiLibre();
  attendrePret(function () { return fen; }, 180000).then(function (ev) {
    if (!ev) { pontMessage = 'Relevés des mails : accord Google non donné.'; panneauSiLibre(); return; }
    var ancien = relaisActif;
    relaisActif = { cible: fen, origine: ev.origin, url: url, cadre: null };
    pontAccord = false;
    lireReleves().then(function () {
      try { fen.postMessage({ fidalRelais: 'appel', op: 'fermer' }, ev.origin); } catch (e) {}
      if (ancien && ancien.cadre) ancien.cadre.remove();
      relaisActif = null;  /* la prochaine lecture repart du cadre invisible, l'accord étant désormais donné */

function chercherDrive(q, fields, orderBy, pageSize) { return appelRelais({ op: 'chercher', q: q, fields: fields, orderBy: orderBy, pageSize: pageSize }); }

function lireReleves() {
  if (pontEnCours) return Promise.resolve();

  var q = "name = '" + DOSSIER_RELEVES.replace(/'/g, "\\'") + "' and mimeType = 'application/vnd.google-apps.folder' and trashed = false";
  return chercherDrive(q, 'files(id)', null, 5).then(function (r) {
    pontAccord = false;
    if (!r.files || !r.files.length) throw new Error('dossier Drive « ' + DOSSIER_RELEVES + ' » introuvable.');
    var q2 = "'" + r.files[0].id + "' in parents and trashed = false and name contains '.json'";
    return Promise.all([
      chercherDrive(q2, 'files(id,name,createdTime)', 'createdTime', 200),

  }).then(function (rr) {
    var connus = {}; (rr[1].ids || []).forEach(function (id) { connus[id] = 1; });
    /* les fiches d'essai (« essai-… ») ne sont pas des relevés */

      var lots = []; for (var i = 0; i < fiches.length; i += 10) lots.push(fiches.slice(i, i + 10));
      var total = { fiches: 0, rattaches: 0, a_rattacher: 0 };
      return lots.reduce(function (p, lot) {
        return p.then(function () { return api('POST', { action: 'releves', fiches: lot }).then(function (j) {
          total.fiches += j.bilan.fiches; total.rattaches += j.bilan.rattaches; total.a_rattacher += j.bilan.a_rattacher; etat.releves = j.releves;
        }); });
      }, Promise.resolve()).then(function () { return total; });
    });
  }).then(function (total) {
    pontMessage = total && total.fiches ? 'Dernière reprise : ' + total.fiches + (total.fiches > 1 ? ' relevés, ' : ' relevé, ') + total.rattaches + ' mail' + (total.rattaches > 1 ? 's' : '') + ' rangé' + (total.rattaches > 1 ? 's' : '') + ', ' + total.a_rattacher + ' à rattacher.' : '';
    return charger();
  }).catch(function (err) {
    pontAccord = !!err.accord;
    pontMessage = pontAccord ? '' : 'Relevés des mails : ' + err.message;
    panneauSiLibre();
  }).then(function () { pontEnCours = false; });
}
function panneauSiLibre() { if (!etat.choisi) panneauATraiter(); }
function heureCourte(iso) { return iso ? new Date(iso).toLocaleString('fr-FR', { timeZone: 'Europe/Paris', day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) : ''; }
function encadreAccord() {
  return el('div', { style: 'border:1px solid var(--orange);border-radius:4px;padding:10px 14px;margin:8px 0;display:flex;gap:12px;align-items:center;flex-wrap:wrap' }, [
    el('span', { texte: 'La lecture des relevés dans le Drive attend votre accord Google.' }),
    el('button', { classe: 'bouton fort', type: 'button', texte: 'Autoriser la lecture du Drive', onclick: autoriserDrive })
  ]);
}
function blocReleves() {
  if (pontAccord) return encadreAccord();
  var r = etat.releves, enfants = [];
  if (!r) return el('p', { classe: 'sous', texte: pontMessage || 'Les relevés des mails apparaîtront ici dès la première fiche reprise.' });
  enfants.push(el('span', { texte: r.dernier ? 'Dernier relevé : ' + heureCourte(r.dernier) : 'Aucun relevé reçu pour l’instant.' }));
  if (r.manques) enfants.push(el('span', { classe: r.manques >= 3 ? 'rouge' : 'alerte', texte: ' — ' + r.manques + ' relevé' + (r.manques > 1 ? 's' : '') + ' manqué' + (r.manques > 1 ? 's' : '') + ' d’affilée' }));
  (r.erreurs || []).slice(0, 2).forEach(function (e) { enfants.push(el('span', { classe: 'alerte', texte: ' — fiche en erreur : ' + (e.erreur || e.nom) })); });
  if (pontMessage) enfants.push(el('span', { texte: ' — ' + pontMessage }));
  return el('p', { classe: 'sous' }, enfants);
}

/* ---------- Mails à rattacher : rattacher, créer, ignorer ---------- */
var PREFIXES = /^(vente|acquisition|donation(-partage)?|succession|bail|cession|promesse|licitation|testament|contrat de mariage|procuration|certification|fiducie)\s+/i;
function propDuMail(m) {
  var nom = m.dossier_pressenti || m.objet || '';
  var sans = nom.replace(PREFIXES, ''), morceaux = sans.split(/\s+\/\s+/);
  var etude = (m.etude || []).concat([m.expediteur].concat(m.destinataires || [], m.copies || []).filter(function (a) { return a && /@fidal\.notaires\.fr$/.test(a); }));
  var ext = [m.expediteur].concat(m.destinataires || [], m.copies || []).filter(function (a) { return a && !/@fidal\.notaires\.fr$/.test(a); });
  return {
    intitule: nom.toUpperCase(), partie1: morceaux[0] || '', partie2: morceaux[1] || '', numero: '', signature_prevue: (m.changements && m.changements.date_signature) || '',
    adresses: ext.filter(function (a, i) { return ext.indexOf(a) === i; }), etude: etude.filter(function (a, i) { return T.estEtude(a) && etude.indexOf(a) === i; }),
    etape: 'en_cours', type_dossier: '', date_ouverture: m.date_mail ? C.aujourdhui(new Date(m.date_mail)) : etat.aujourdhui, mail_outlook: m.id_outlook,
    mail: { objet: m.objet, expediteur: m.sens === 'envoyé' ? 'à ' + (m.destinataires || []).join(', ') : m.expediteur, date: m.date_mail ? C.aujourdhui(new Date(m.date_mail)) : '', apercu: m.resume || '' }
  };
}
function meilleurDossier(m, ouverts) {
  var cible = sansAccent(m.dossier_pressenti || m.objet || '').replace(/[^a-z0-9]+/g, ' ');
  var meilleur = null, score = 0;
  ouverts.forEach(function (d) {
    var mots = sansAccent((d.partie1 || '') + ' ' + (d.partie2 || '') + ' ' + (d.numero || '')).split(/[^a-z0-9]+/).filter(function (x) { return x.length > 2; });
    var s = mots.filter(function (x) { return cible.indexOf(x) >= 0; }).length;
    if (s > score) { score = s; meilleur = d; }
  });
  return meilleur;
}
function ouvrirARattacher() {
  return api('GET', { action: 'a_rattacher' }).then(function (j) {
    etat.ouvert = null;
    var v = enteteVolet('Mails à rattacher');
    var ouverts = etat.dossiers.filter(function (d) { return actif(d) && d.etape !== 'abandonne' && d.etape !== 'clos'; })
      .sort(function (a, b) { return a.intitule.localeCompare(b.intitule, 'fr'); });
    if (!j.mails.length) { v.appendChild(el('p', { classe: 'sous', texte: 'Aucun mail en attente : tout est rangé.' })); return; }
    v.appendChild(el('p', { classe: 'sous', texte: j.mails.length + ' mail' + (j.mails.length > 1 ? 's' : '') + ' que SUIVI n’a pas pu ranger avec certitude, du plus récent au plus ancien.' }));
    j.mails.forEach(function (m) {
      var choix = el('select', { 'aria-label': 'Dossier' });
      choix.appendChild(el('option', { value: '', texte: 'Choisir le dossier…' }));
      var proche = meilleurDossier(m, ouverts);
      ouverts.forEach(function (d) { var o = el('option', { value: String(d.id), texte: d.intitule }); if (proche && d.id === proche.id) o.selected = true; choix.appendChild(o); });
      var qui = m.sens === 'envoyé' ? 'Envoyé à ' + (m.destinataires || []).slice(0, 2).join(', ') : 'Reçu de ' + (m.expediteur || '?');
      var details = [el('b', { texte: m.objet || '(sans objet)' }), el('span', { classe: 'sous', texte: heureCourte(m.date_mail) + ' — ' + qui })];
      if (m.resume) details.push(el('span', { texte: m.resume }));
      if (m.dossier_pressenti) details.push(el('span', { classe: 'sous', texte: 'Dossier pressenti : ' + m.dossier_pressenti + (m.motif_rattachement ? ' (' + m.motif_rattachement + ')' : '') + ' — ' + (m.motif_etat || m.certitude) }));
      else if (m.motif_etat) details.push(el('span', { classe: 'sous', texte: m.motif_etat }));
      if (m.pieces_jointes && m.pieces_jointes.length) details.push(el('span', { classe: 'sous', texte: 'Pièces jointes : ' + m.pieces_jointes.join(', ') }));
      var li = el('section', { classe: 'bloc mail-attente' }, details.concat([
        el('div', { classe: 'ligne' }, [choix,
          el('button', { classe: 'bouton fort petit', texte: 'Rattacher', onclick: function () {
            if (!choix.value) return choix.focus();
            api('POST', { action: 'mail_rattacher', mail_id: m.id_outlook, id: +choix.value }).then(charger).then(ouvrirARattacher).catch(alerte);
          } }),
          el('button', { classe: 'bouton petit', texte: 'Créer un dossier', onclick: function () { nouveauDossier(propDuMail(m)); } }),
          el('button', { classe: 'bouton petit', texte: 'Ignorer', onclick: function () {
            api('POST', { action: 'mail_ignorer', mail_id: m.id_outlook }).then(function (r) {
              if (r.fois === 2) window.alert('Deuxième mail ignoré de ' + r.expediteur + ' : ses prochains mails seront écartés d’office.');
            }).then(charger).then(ouvrirARattacher).catch(alerte);
          } })
        ])
      ]));
      v.appendChild(li);
    });
  }).catch(alerte);
}

/* ---------- Démarrage ---------- */
if (sessionStorage.getItem(CLE)) demarrer().catch(function () { verrouiller(); });
else verrouiller();
</script>
